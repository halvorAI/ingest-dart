name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        sdk: ['3.6.0', stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart format --line-length 100 --output=none --set-exit-if-changed packages
      - run: dart analyze --fatal-infos
      - run: dart test
        working-directory: packages/halvorai_ingest
