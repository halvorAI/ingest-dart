name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        # 3.27 is the oldest Flutter with Dart 3.6, the packages' minimum.
        flutter: ['3.27.0', stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter == 'stable' && '' || matrix.flutter }}
          channel: stable
      - run: flutter pub get
      - run: dart format --line-length 100 --output=none --set-exit-if-changed packages
      - run: flutter analyze --fatal-infos
      - run: dart test
        working-directory: packages/halvorai_ingest
      - run: flutter test
        working-directory: packages/halvorai_ingest_flutter
